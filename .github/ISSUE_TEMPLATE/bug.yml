name: Bug report
description: Something in Seekr doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Alt+Space
        2. Type ...
  - type: input
    id: version
    attributes:
      label: Seekr version and Windows version
      placeholder: Seekr 0.1.2, Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        From Settings → Diagnostics: the counts, latencies and log lines that look related.
        Leave out anything private.
      render: text
