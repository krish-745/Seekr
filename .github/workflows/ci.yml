# The checks in scripts/check.ps1, on every push and pull request, apart from the WebDriver smoke
# test: it presses a hotkey and needs a signed-in desktop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about@0.9.2

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo deny
        run: cargo deny check
      - name: third-party notices
        shell: powershell
        run: scripts\notices.ps1 -Check
      - name: npm ci
        working-directory: app
        run: npm ci
      - name: tsc
        working-directory: app
        run: npm run typecheck
      - name: vitest
        working-directory: app
        run: npm test
      - name: release build
        working-directory: app
        run: npm run tauri build -- --no-bundle
      - name: service and indexer release build
        run: cargo build --release -p service -p indexer
