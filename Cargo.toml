[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/common", "crates/content", "crates/fsindex", "crates/indexer", "crates/service"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["krish-745"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
