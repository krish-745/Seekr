[package]
name = "seekr"
description = "Fast keyboard launcher for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "seekr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
common = { path = "../../crates/common" }
fsindex = { path = "../../crates/fsindex" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"
nucleo-matcher = "0.3.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
webview2-com = "0.39"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
